name: Validate global notch panels
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/global-notch-spaces
      - name: Select Swift 6.0
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Test
        run: swift test
      - name: Package
        run: APP_VERSION=0.2.1 BUILD_NUMBER=40 ./Scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchNotes-global-panels
          path: |
            dist.noindex/NotchNotes.zip
            dist.noindex/NotchNotes.zip.sha256
